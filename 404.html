<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada · Atas da Reunião Sacramental</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#003238" />
    <!--
      A página que o GitHub Pages mostra quando o endereço não existe. Ela é servida de qualquer profundidade
      (…/atas-sacramentais/qualquer/coisa), então só usa endereços ABSOLUTOS e estilo próprio, sem depender de css/js.
      Em outro endereço, troque as URLs absolutas aqui, como as do og:url no index.html.
    -->
    <link rel="icon" type="image/svg+xml" href="https://jerovane.github.io/atas-sacramentais/assets/icones/favicon.svg" />
    <style>
      :root { --petroleo: #003238; --ouro: #b0761a; --creme: #fbf6ea; --texto: #19363b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: linear-gradient(160deg, #e3f0f1, #f6f8f5 50%, var(--creme)); }
      header { background: linear-gradient(90deg, #002a2f, #00464d); padding: 12px 20px; border-bottom: 2px solid var(--ouro); }
      header img { display: block; }
      main { flex: 1; width: 100%; max-width: 34rem; margin: 0 auto; padding: 48px 20px; }
      .selo { margin: 0 0 12px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ouro); }
      h1 { margin: 0 0 14px; font-family: Lora, Georgia, serif; font-size: 2rem; line-height: 1.2; color: var(--petroleo); }
      p { margin: 0 0 24px; line-height: 1.55; }
      a.botao { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--petroleo); color: #fff; font-weight: 600; text-decoration: none; }
      a.botao:hover, a.botao:focus-visible { background: #00464d; outline: 3px solid #e8c36a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <img src="https://jerovane.github.io/atas-sacramentais/assets/marca/logo-estaca.png" alt="Estaca Pacajus Brasil" width="104" height="47" />
    </header>
    <main>
      <p class="selo">Erro 404</p>
      <h1>Esta página não existe</h1>
      <p>O endereço pode ter sido digitado errado, ou a página mudou de lugar. O caderno de atas está na página inicial.</p>
      <a class="botao" href="https://jerovane.github.io/atas-sacramentais/">Ir para a página inicial</a>
    </main>
  </body>
</html>
