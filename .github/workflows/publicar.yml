# Publica o site no GitHub Pages a cada alteração na branch main.
#
# Antes de publicar, roda os testes: se algum falhar, nada vai ao ar. Só os arquivos do site são
# publicados (index.html, css, js, assets, vendor) — testes e ferramentas ficam de fora.
#
# Ativação (uma vez): no GitHub, Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências de teste
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Montar o site (só o que vai ao ar)
        run: |
          mkdir _site
          cp -r index.html css js assets vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicacao
        uses: actions/deploy-pages@v4
